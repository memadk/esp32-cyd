; PlatformIO project for the Sunton ESP32-2432S024C ("Cheap Yellow Display", 2.4" capacitive)
;   ESP32-D0WD-V3 (rev 3.1), 4 MB flash, CH340 USB-serial, MAC 24:dc:c3:9a:6b:0c
;   Display: ILI9341 240x320 SPI  (MOSI 13, MISO 12, SCLK 14, CS 15, DC 2, BL 27)
;   Touch:   CST820 capacitive I2C (SDA 33, SCL 32, RST 25, INT 22)
;   RGB LED: R 4, G 16, B 17 (active low)   LDR: 34   Speaker: 26   SD: CS 5 / 23 / 19 / 18
;
; Graphics stack: LovyanGFX (display + touch driver) + LVGL 9 (UI).
; Pin mapping lives in include/lgfx_cyd_2432s024c.hpp. LVGL config in include/lv_conf.h.

[platformio]
default_envs = cyd

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_port = /dev/cu.usbserial-120
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.partitions = min_spiffs.csv   ; 2 x 1.9 MB OTA apps + 190 KB SPIFFS

lib_deps =
    lovyan03/LovyanGFX @ ^1.2.28
    lvgl/lvgl @ 9.2.2
    bblanchon/ArduinoJson @ ^7.3.0

build_flags =
    -O2
    -Wall
    -D CORE_DEBUG_LEVEL=3
    -D LGFX_USE_V1
    -D USE_ESP_IDF_LOG
    -D LV_CONF_PATH=${platformio.include_dir}/lv_conf.h
    ; Board pins (used by main.cpp for the non-display peripherals)
    -D PIN_LED_R=4
    -D PIN_LED_G=16
    -D PIN_LED_B=17
    -D PIN_LDR=34
    -D PIN_SPEAKER=26
    -D PIN_SD_CS=5
    ; Touch panel orientation relative to the display (1 = mirror that axis)
    -D TOUCH_FLIP_X=1
    -D TOUCH_FLIP_Y=1

; ---- Board 1 (kitchen): USB flashing (first install, or when OTA is unreachable)
[env:cyd]
build_src_filter = +<*> -<info/>
build_flags = ${env.build_flags} -D OTA_HOSTNAME='"sonos-koekken"'
upload_port = /dev/cu.usbserial-120
upload_speed = 460800          ; CH340 is unreliable above this

; ---- Board 1: over-the-air update:  pio run -e cyd_ota -t upload
[env:cyd_ota]
build_src_filter = +<*> -<info/>
build_flags = ${env.build_flags} -D OTA_HOSTNAME='"sonos-koekken"'
upload_protocol = espota
upload_port = sonos-koekken.local
upload_flags =
    --port=3232
    --timeout=30

; ---- Board 2 (second CYD, MAC 24:dc:c3:9a:6e:1c): own hostname so the two never clash on mDNS/OTA
[env:cyd2]
build_src_filter = +<*> -<info/>
build_flags = ${env.build_flags} -D OTA_HOSTNAME='"sonos-remote-2"'
upload_port = /dev/cu.usbserial-120
upload_speed = 460800

[env:cyd2_ota]
build_src_filter = +<*> -<info/>
build_flags = ${env.build_flags} -D OTA_HOSTNAME='"sonos-remote-2"'
upload_protocol = espota
upload_port = sonos-remote-2.local
upload_flags =
    --port=3232
    --timeout=30

; ---- Board 2 as INFO BOARD (electricity prices, weather, bus departures). Hostname infotavle.local
[env:info2]
build_src_filter = +<info/> +<fonts/> +<rlog.cpp>
build_flags = ${env.build_flags} -D OTA_HOSTNAME='"infotavle"'
upload_port = /dev/cu.usbserial-120
upload_speed = 460800

[env:info2_ota]
build_src_filter = +<info/> +<fonts/> +<rlog.cpp>
build_flags = ${env.build_flags} -D OTA_HOSTNAME='"infotavle"'
upload_protocol = espota
upload_port = infotavle.local
upload_flags =
    --port=3232
    --timeout=30
