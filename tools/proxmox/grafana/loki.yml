# Loki single-binary, filesystem storage, 90-day retention. Listens on localhost only (Grafana + Alloy are local).
auth_enabled: false
server:
  http_listen_address: 127.0.0.1
  http_listen_port: 3100
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 9096
  log_level: warn
common:
  instance_addr: 127.0.0.1
  path_prefix: /var/lib/loki
  storage:
    filesystem:
      chunks_directory: /var/lib/loki/chunks
      rules_directory: /var/lib/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
compactor:
  working_directory: /var/lib/loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
limits_config:
  retention_period: 2160h          # 90 days
  reject_old_samples: true
  reject_old_samples_max_age: 720h # allow importing the Mac's log history (30 days)
  allow_structured_metadata: true
  discover_service_name: []       # no auto service_name label
  discover_log_levels: false       # level label is set by Alloy
query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 50
analytics:
  reporting_enabled: false
